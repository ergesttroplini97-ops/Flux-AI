<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Flux AI">
  <defs>
    <linearGradient id="g" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#0066FF"/>
      <stop offset="45%"  stop-color="#00C8FF"/>
      <stop offset="80%"  stop-color="#10B981"/>
      <stop offset="100%" stop-color="#7FFF00"/>
